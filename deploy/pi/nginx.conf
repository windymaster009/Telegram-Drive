server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/telegram-drive/frontend/dist;
    index index.html;

    # Telegram Drive may handle large uploads. Let the backend enforce its own limits.
    client_max_body_size 0;

    # Keep browser traffic same-origin and hide the Rust API port from users.
    location /api/ {
        proxy_pass http://127.0.0.1:14201;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload/download/stream endpoints should not be buffered by Nginx.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache fingerprinted frontend assets.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # React SPA routes such as OAuth callbacks must resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
